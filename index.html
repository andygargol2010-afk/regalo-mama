<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para vos, Ma ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #fff5f7;
      --bg2: #fce7f3;
      --bg3: #f3e8ff;
      --text: #4a3f4a;
      --accent: #e11d48;
      --accent-soft: #fb7185;
      --heart-stroke: #fda4af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      color: var(--text);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Soft floating orbs for ambient feel */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: #fda4af;
      top: -80px;
      left: -60px;
      animation: float 12s ease-in-out infinite;
    }
    .orb-2 {
      width: 280px;
      height: 280px;
      background: #c4b5fd;
      bottom: -60px;
      right: -40px;
      animation: float 15s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 200px;
      height: 200px;
      background: #fbcfe8;
      top: 40%;
      right: 15%;
      animation: float 10s ease-in-out infinite 2s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -25px); }
    }

    #message {
      position: relative;
      z-index: 10;
      max-width: 640px;
      padding: 0 24px;
      text-align: center;
      font-size: clamp(1.05rem, 2.6vw, 1.35rem);
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    #message .line {
      display: block;
      margin-bottom: 0.55em;
    }

    #message .line:last-child {
      margin-bottom: 0;
      margin-top: 1.1em;
      font-weight: 500;
      font-size: 1.05em;
    }

    #message .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(-28px);
      transition: none;
    }

    #message .letter.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #message .letter.space {
      width: 0.28em;
    }

    /* Canvas for particles + heart */
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* Replay button */
    #replay {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(225, 29, 72, 0.18);
      color: var(--accent);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.6s ease, transform 0.6s ease, background 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.08);
    }

    #replay.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    #replay:hover {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 28px rgba(225, 29, 72, 0.14);
    }

    #replay:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* Small signature that appears near the end */
    #signature {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.8s ease;
      letter-spacing: 0.03em;
    }

    #signature.visible {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div id="message" aria-live="polite"></div>
    <canvas id="stage"></canvas>
    <div id="signature">Andy</div>
    <button id="replay" type="button">Ver de nuevo</button>
  </div>

  <script>
    // ---------- Config ----------
    const LINES = [
      "Hola Ma, espero la pases muy lindo en este día de la madre",
      "en este día de la madre 2026 intenté hacer algo distinto, espero que te guste y disfrutes tu día.",
      "Andy"
    ];

    const LETTER_DELAY = 38;        // ms between letters
    const HOLD_AFTER_TEXT = 2200;   // pause before disintegration
    const PARTICLE_COUNT_PER_LETTER = 7;
    const HEART_FILL_DURATION = 2200;

    // ---------- DOM ----------
    const messageEl = document.getElementById('message');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const replayBtn = document.getElementById('replay');
    const signatureEl = document.getElementById('signature');

    let width, height, dpr;
    let particles = [];
    let heartPoints = [];
    let animationPhase = 'idle'; // idle | text | disintegrate | formHeart | fillHeart | done
    let fillProgress = 0;
    let rafId = null;
    let letterSpans = [];

    // ---------- Utils ----------
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Heart parametric equation (classic cardioid-like heart)
    function heartPoint(t, scale, cx, cy) {
      // t in [0, 2π]
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: cx + x * scale,
        y: cy + y * scale
      };
    }

    function generateHeartOutline(count, scale, cx, cy) {
      const pts = [];
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        pts.push(heartPoint(t, scale, cx, cy));
      }
      return pts;
    }

    function generateHeartFillPoints(rows, scale, cx, cy) {
      // Sample points inside the heart for denser look (used for particle targets)
      const pts = [];
      const steps = 80;
      for (let i = 0; i < steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const outer = heartPoint(t, scale, cx, cy);
        // also add some inner points
        for (let r = 0.25; r < 1; r += 0.25) {
          const inner = heartPoint(t, scale * r, cx, cy);
          pts.push(inner);
        }
        pts.push(outer);
      }
      return pts;
    }

    // ---------- Build text ----------
    function buildMessage() {
      messageEl.innerHTML = '';
      letterSpans = [];

      LINES.forEach((line, lineIdx) => {
        const lineEl = document.createElement('span');
        lineEl.className = 'line';

        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          const span = document.createElement('span');
          span.className = 'letter' + (ch === ' ' ? ' space' : '');
          span.textContent = ch === ' ' ? '\u00A0' : ch;
          lineEl.appendChild(span);
          letterSpans.push(span);
        }

        messageEl.appendChild(lineEl);
      });
    }

    // ---------- Animation phases ----------
    function showLetters() {
      animationPhase = 'text';
      let delay = 0;

      letterSpans.forEach((span, i) => {
        setTimeout(() => {
          span.classList.add('visible');
        }, delay);
        delay += LETTER_DELAY;
      });

      // After all letters + hold → start disintegration
      const totalTextTime = letterSpans.length * LETTER_DELAY + HOLD_AFTER_TEXT;
      setTimeout(startDisintegration, totalTextTime);
    }

    function startDisintegration() {
      animationPhase = 'disintegrate';
      particles = [];

      const heartScale = Math.min(width, height) * 0.0135;
      const cx = width / 2;
      const cy = height / 2 - 20;
      const outline = generateHeartOutline(140, heartScale, cx, cy);
      const fillPts = generateHeartFillPoints(40, heartScale * 0.92, cx, cy);
      heartPoints = [...outline, ...fillPts];

      // Create particles from each letter
      letterSpans.forEach((span, idx) => {
        if (span.classList.contains('space')) return;

        const rect = span.getBoundingClientRect();
        const startX = rect.left + rect.width / 2;
        const startY = rect.top + rect.height / 2;

        for (let p = 0; p < PARTICLE_COUNT_PER_LETTER; p++) {
          const target = heartPoints[Math.floor(Math.random() * heartPoints.length)];
          const angle = Math.random() * Math.PI * 2;
          const burst = 30 + Math.random() * 90;

          particles.push({
            x: startX + (Math.random() - 0.5) * 6,
            y: startY + (Math.random() - 0.5) * 6,
            vx: Math.cos(angle) * burst * 0.02,
            vy: Math.sin(angle) * burst * 0.02,
            targetX: target.x + (Math.random() - 0.5) * 8,
            targetY: target.y + (Math.random() - 0.5) * 8,
            size: 1.6 + Math.random() * 2.2,
            alpha: 0.85 + Math.random() * 0.15,
            color: Math.random() > 0.7 ? '#fb7185' : '#e11d48',
            progress: 0,
            delay: Math.random() * 0.35,
            life: 1
          });
        }

        // Hide original letter
        span.style.opacity = '0';
        span.style.transition = 'opacity 0.4s ease';
      });

      // Also hide the whole message container softly
      setTimeout(() => {
        messageEl.style.opacity = '0';
        messageEl.style.transition = 'opacity 0.5s ease';
      }, 300);

      // Start the particle animation loop
      let startTime = null;
      const duration = 2400; // ms to form the heart

      function animateForm(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const t = Math.min(1, elapsed / duration);

        ctx.clearRect(0, 0, width, height);

        let allArrived = true;

        particles.forEach(p => {
          const localT = Math.max(0, Math.min(1, (t - p.delay) / (1 - p.delay)));
          const eased = easeOutCubic(localT);

          // Slight initial burst then pull to target
          if (localT < 0.25) {
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.92;
            p.vy *= 0.92;
          }

          p.x += (p.targetX - p.x) * (0.06 + eased * 0.12);
          p.y += (p.targetY - p.y) * (0.06 + eased * 0.12);

          const dist = Math.hypot(p.targetX - p.x, p.targetY - p.y);
          if (dist > 3) allArrived = false;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.7 + eased * 0.3), 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha * (0.5 + eased * 0.5);
          ctx.fill();
        });

        ctx.globalAlpha = 1;

        if (t < 1 || !allArrived) {
          rafId = requestAnimationFrame(animateForm);
        } else {
          // Particles have formed the shape → draw clean heart outline then fill
          startHeartReveal(cx, cy, heartScale);
        }
      }

      rafId = requestAnimationFrame(animateForm);
    }

    function startHeartReveal(cx, cy, scale) {
      animationPhase = 'formHeart';

      // Fade out remaining particles while drawing the clean heart
      let fade = 1;
      const outlinePts = generateHeartOutline(200, scale, cx, cy);

      function drawOutlineFrame() {
        ctx.clearRect(0, 0, width, height);

        // residual particles fading
        fade *= 0.94;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha * fade * 0.4;
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Heart outline (stroke only, soft pink)
        ctx.beginPath();
        outlinePts.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
        ctx.strokeStyle = 'var(--heart-stroke)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (fade > 0.05) {
          rafId = requestAnimationFrame(drawOutlineFrame);
        } else {
          // Start fill from bottom to top
          startFill(cx, cy, scale, outlinePts);
        }
      }

      rafId = requestAnimationFrame(drawOutlineFrame);
    }

    function startFill(cx, cy, scale, outlinePts) {
      animationPhase = 'fillHeart';
      fillProgress = 0;
      const start = performance.now();

      // Precompute bounding box of heart for clip
      let minY = Infinity, maxY = -Infinity;
      outlinePts.forEach(p => {
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });
      const heartHeight = maxY - minY;

      function fillFrame(now) {
        const elapsed = now - start;
        fillProgress = Math.min(1, elapsed / HEART_FILL_DURATION);
        const eased = easeInOutCubic(fillProgress);

        ctx.clearRect(0, 0, width, height);

        // Draw outline always
        ctx.beginPath();
        outlinePts.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Clip and fill from bottom
        ctx.save();
        ctx.beginPath();
        outlinePts.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
        ctx.clip();

        // Fill rectangle that grows from bottom
        const fillTop = maxY - heartHeight * eased;
        const gradient = ctx.createLinearGradient(cx, maxY, cx, fillTop);
        gradient.addColorStop(0, '#e11d48');
        gradient.addColorStop(0.55, '#f43f5e');
        gradient.addColorStop(1, '#fb7185');

        ctx.fillStyle = gradient;
        ctx.fillRect(cx - scale * 20, fillTop, scale * 40, maxY - fillTop + 10);

        ctx.restore();

        // Soft glow
        if (eased > 0.3) {
          ctx.save();
          ctx.globalAlpha = (eased - 0.3) * 0.25;
          ctx.shadowColor = '#e11d48';
          ctx.shadowBlur = 30;
          ctx.beginPath();
          outlinePts.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.closePath();
          ctx.fillStyle = '#e11d48';
          ctx.fill();
          ctx.restore();
        }

        if (fillProgress < 1) {
          rafId = requestAnimationFrame(fillFrame);
        } else {
          animationPhase = 'done';
          // Keep final heart and show button
          showReplay();
        }
      }

      rafId = requestAnimationFrame(fillFrame);
    }

    function showReplay() {
      signatureEl.classList.add('visible');
      setTimeout(() => {
        replayBtn.classList.add('visible');
      }, 400);
    }

    function resetAll() {
      cancelAnimationFrame(rafId);
      particles = [];
      fillProgress = 0;
      animationPhase = 'idle';

      ctx.clearRect(0, 0, width, height);
      messageEl.style.opacity = '1';
      messageEl.style.transition = 'none';
      signatureEl.classList.remove('visible');
      replayBtn.classList.remove('visible');

      buildMessage();
      // small delay so the DOM is ready
      setTimeout(showLetters, 80);
    }

    // ---------- Init ----------
    window.addEventListener('resize', () => {
      resize();
      // If already done, just redraw the final heart
      if (animationPhase === 'done') {
        const heartScale = Math.min(width, height) * 0.0135;
        const cx = width / 2;
        const cy = height / 2 - 20;
        const outlinePts = generateHeartOutline(200, heartScale, cx, cy);

        ctx.clearRect(0, 0, width, height);
        ctx.beginPath();
        outlinePts.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
        ctx.fillStyle = '#e11d48';
        ctx.fill();
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    });

    replayBtn.addEventListener('click', resetAll);

    resize();
    buildMessage();
    // Start after a short breath
    setTimeout(showLetters, 600);
  </script>
</body>
</html>
