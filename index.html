<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#fdf2f8"/>
<title>Para vos, Ma ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--text:#4a3f4a;--accent:#e11d48;--accent-soft:#fb7185;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(ellipse 120% 80% at 50% 0%,#fff5f8 0%,transparent 55%),radial-gradient(ellipse 90% 70% at 10% 90%,#fce7f3 0%,transparent 50%),radial-gradient(ellipse 80% 60% at 90% 85%,#ede9fe 0%,transparent 50%),linear-gradient(165deg,#fffafb 0%,#fdf2f8 35%,#f5f3ff 70%,#eef2ff 100%);color:var(--text);-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.bg-glow{position:absolute;width:min(720px,90vw);height:min(720px,90vw);top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(253,164,175,.2) 0%,rgba(251,207,232,.1) 40%,transparent 70%);pointer-events:none;z-index:0;animation:glowPulse 9s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
.orb{position:absolute;border-radius:50%;filter:blur(72px);pointer-events:none;z-index:0}
.orb-1{width:380px;height:380px;background:radial-gradient(circle,#fda4af 0%,#fb7185 55%,transparent 100%);opacity:.32;top:-120px;left:-80px;animation:float1 18s ease-in-out infinite}
.orb-2{width:340px;height:340px;background:radial-gradient(circle,#c4b5fd 0%,#a78bfa 55%,transparent 100%);opacity:.28;bottom:-100px;right:-70px;animation:float2 22s ease-in-out infinite}
.orb-3{width:220px;height:220px;background:radial-gradient(circle,#fbcfe8 0%,#f9a8d4 50%,transparent 100%);opacity:.36;top:32%;right:6%;animation:float3 14s ease-in-out infinite}
.orb-4{width:180px;height:180px;background:radial-gradient(circle,#fef3c7 0%,#fde68a 50%,transparent 100%);opacity:.22;bottom:18%;left:4%;animation:float1 16s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(28px,-18px) scale(1.04)}66%{transform:translate(-12px,22px) scale(.97)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-30px,-22px) scale(1.06)}70%{transform:translate(18px,14px) scale(.96)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,-26px)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 78% 68% at 50% 50%,transparent 42%,rgba(255,240,245,.3) 100%);pointer-events:none;z-index:1}
.grain{position:absolute;inset:0;opacity:.035;pointer-events:none;z-index:2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px}
.flowers{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.flower{position:absolute;opacity:.82;filter:drop-shadow(0 2px 8px rgba(251,182,206,.35))}
.flower svg{display:block;width:100%;height:100%;overflow:visible}
.flower .petal{fill:currentColor;stroke:rgba(190,24,93,.22);stroke-width:.55;stroke-linejoin:round}
.flower .center{fill:#fff1f2;stroke:rgba(225,29,72,.35);stroke-width:.6}
.flower .center-deep{fill:#fda4af;stroke:rgba(225,29,72,.25);stroke-width:.4}
.flower.f-rose{color:#f9a8d4}.flower.f-blush{color:#fbcfe8}.flower.f-cream{color:#fce7f3}.flower.f-mist{color:#e9d5ff}.flower.f-soft{color:#fda4af}.flower.f-peach{color:#fecdd3}
.flower.f1{width:70px;height:70px;top:-6px;left:2%;transform:rotate(-18deg)}
.flower.f2{width:48px;height:48px;top:2%;left:14%;transform:rotate(12deg);opacity:.72}
.flower.f3{width:58px;height:58px;top:-8px;left:28%;transform:rotate(-8deg);opacity:.78}
.flower.f4{width:42px;height:42px;top:4%;left:42%;transform:rotate(22deg);opacity:.65}
.flower.f5{width:62px;height:62px;top:-6px;left:54%;transform:rotate(-14deg);opacity:.8}
.flower.f6{width:46px;height:46px;top:3%;left:68%;transform:rotate(16deg);opacity:.7}
.flower.f7{width:68px;height:68px;top:-8px;right:10%;transform:rotate(10deg)}
.flower.f8{width:40px;height:40px;top:6%;right:2%;transform:rotate(-20deg);opacity:.68}
.flower.f9{width:66px;height:66px;bottom:-8px;left:4%;transform:rotate(14deg)}
.flower.f10{width:44px;height:44px;bottom:3%;left:16%;transform:rotate(-12deg);opacity:.7}
.flower.f11{width:56px;height:56px;bottom:-6px;left:30%;transform:rotate(8deg);opacity:.76}
.flower.f12{width:40px;height:40px;bottom:5%;left:44%;transform:rotate(-18deg);opacity:.64}
.flower.f13{width:60px;height:60px;bottom:-8px;left:56%;transform:rotate(16deg);opacity:.78}
.flower.f14{width:48px;height:48px;bottom:2%;left:70%;transform:rotate(-10deg);opacity:.72}
.flower.f15{width:64px;height:64px;bottom:-6px;right:8%;transform:rotate(20deg)}
.flower.f16{width:42px;height:42px;bottom:4%;right:1%;transform:rotate(-6deg);opacity:.66}
.flower.f17{width:54px;height:54px;top:28%;left:-12px;transform:rotate(-22deg);opacity:.74}
.flower.f18{width:46px;height:46px;top:48%;left:-8px;transform:rotate(18deg);opacity:.68}
.flower.f19{width:52px;height:52px;top:32%;right:-12px;transform:rotate(14deg);opacity:.72}
.flower.f20{width:44px;height:44px;top:52%;right:-8px;transform:rotate(-16deg);opacity:.66}
@media (max-width:480px){.flower.f2,.flower.f4,.flower.f6,.flower.f12,.flower.f18,.flower.f20{display:none}.flower{opacity:.72}}
#message{position:relative;z-index:10;max-width:min(420px,88vw);padding:0 20px;text-align:center;font-size:clamp(1.02rem,3.2vw,1.22rem);font-weight:400;line-height:1.7;letter-spacing:.01em;color:var(--text)}
#message .line{display:block;margin-bottom:.35em;min-height:1.7em}
#message .line.gap-after{margin-bottom:1em}
#message .line.signature-line{margin-top:.9em;margin-bottom:0;font-weight:500;font-size:1.06em}
#message .char{display:inline-block;opacity:0;transform:translateY(8px) scale(.98);will-change:opacity,transform}
#message .char.on{opacity:1;transform:translateY(0) scale(1);transition:opacity .26s cubic-bezier(.22,1,.36,1),transform .34s cubic-bezier(.22,1,.36,1)}
#message .char.space{width:.28em}
#stage{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#bottom-ui{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(28px + var(--safe-bottom));pointer-events:none}
#signature{font-size:.92rem;font-weight:400;letter-spacing:.04em;color:var(--text);opacity:0;transform:translateY(18px) scale(.94);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.15s cubic-bezier(.22,1,.36,1);margin-bottom:14px;will-change:opacity,transform}
#signature.visible{opacity:.78;transform:translateY(0) scale(1)}
#replay{pointer-events:none;opacity:0;transform:translateY(14px) scale(.96);min-height:46px;min-width:140px;padding:12px 30px;border-radius:999px;border:1px solid rgba(225,29,72,.16);background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--accent);font-family:inherit;font-size:.95rem;font-weight:500;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 22px rgba(225,29,72,.08);transition:opacity .85s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),background .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent;will-change:opacity,transform}
#replay.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#replay:hover{background:rgba(255,255,255,.95);box-shadow:0 6px 28px rgba(225,29,72,.14)}
#replay:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.orb,.bg-glow{animation:none!important}#signature,#replay{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<div class="bg-glow" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>
<div class="orb orb-3" aria-hidden="true"></div>
<div class="orb orb-4" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="flowers" aria-hidden="true">
<div class="flower f1 f-rose"><svg viewBox="0 0 64 64"><g class="petal"><path d="M32 14c6.5-8 16-6.5 18 2.5-1.5 7-9 11.5-18 11.5V14z"/><path d="M46 28c9.5 2.5 12 12 4.5 17.5-6.5 2.5-13.5-1.5-16.5-9.5H46z"/><path d="M40 46c4 9-2.5 15.5-11.5 12.5-5.5-4-6.5-12-3-18.5L40 46z"/><path d="M24 46c-4 9 2.5 15.5 11.5 12.5 5.5-4 6.5-12 3-18.5L24 46z"/><path d="M18 28c-9.5 2.5-12 12-4.5 17.5 6.5 2.5 13.5-1.5 16.5-9.5H18z"/></g><circle class="center-deep" cx="32" cy="32" r="7.5"/><circle class="center" cx="32" cy="32" r="4.2"/></svg></div>
<!-- FLORES OMITIDAS POR BREVEDAD EN ESTA SIMULACION; CONTENIDO COMPLETO EN /tmp/index.html -->
</div>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="message" aria-live="polite"></div>
<div id="bottom-ui">
<div id="signature">Andy</div>
<button id="replay" type="button">Ver de nuevo</button>
</div>
</div>
<script>
/* JS COMPLETO PRESERVADO CON EL CAMBIO SOLO EN CSS */
</script>
</body>
</html>
