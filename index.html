<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf2f8" />
  <title>Para vos, Ma ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #4a3f4a;
      --accent: #e11d48;
      --accent-soft: #fb7185;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(ellipse 120% 80% at 50% 0%, #fff5f8 0%, transparent 55%),
        radial-gradient(ellipse 90% 70% at 10% 90%, #fce7f3 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 90% 85%, #ede9fe 0%, transparent 50%),
        linear-gradient(165deg, #fffafb 0%, #fdf2f8 35%, #f5f3ff 70%, #eef2ff 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .bg-glow {
      position: absolute; width: min(720px, 90vw); height: min(720px, 90vw);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(253, 164, 175, 0.2) 0%, rgba(251, 207, 232, 0.1) 40%, transparent 70%);
      pointer-events: none; z-index: 0; animation: glowPulse 9s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.65; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(72px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 380px; height: 380px; background: radial-gradient(circle, #fda4af 0%, #fb7185 55%, transparent 100%); opacity: 0.32; top: -120px; left: -80px; animation: float1 18s ease-in-out infinite; }
    .orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, #c4b5fd 0%, #a78bfa 55%, transparent 100%); opacity: 0.28; bottom: -100px; right: -70px; animation: float2 22s ease-in-out infinite; }
    .orb-3 { width: 220px; height: 220px; background: radial-gradient(circle, #fbcfe8 0%, #f9a8d4 50%, transparent 100%); opacity: 0.36; top: 32%; right: 6%; animation: float3 14s ease-in-out infinite; }
    .orb-4 { width: 180px; height: 180px; background: radial-gradient(circle, #fef3c7 0%, #fde68a 50%, transparent 100%); opacity: 0.22; bottom: 18%; left: 4%; animation: float1 16s ease-in-out infinite reverse; }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(28px, -18px) scale(1.04); }
      66% { transform: translate(-12px, 22px) scale(0.97); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40% { transform: translate(-30px, -22px) scale(1.06); }
      70% { transform: translate(18px, 14px) scale(0.96); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-18px, -26px); }
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 78% 68% at 50% 50%, transparent 42%, rgba(255, 240, 245, 0.3) 100%);
      pointer-events: none; z-index: 1;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.035; pointer-events: none; z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }
    #message {
      position: relative; z-index: 10; max-width: min(420px, 88vw); padding: 0 20px;
      text-align: center; font-size: clamp(1.02rem, 3.2vw, 1.22rem);
      font-weight: 400; line-height: 1.7; letter-spacing: 0.01em; color: var(--text);
    }
    #message .line { display: block; margin-bottom: 0.35em; min-height: 1.7em; }
    #message .line.gap-after { margin-bottom: 1em; }
    #message .line.signature-line { margin-top: 0.9em; margin-bottom: 0; font-weight: 500; font-size: 1.06em; }
    #message .char { display: inline-block; opacity: 0; transform: translateY(10px); }
    #message .char.on {
      opacity: 1; transform: translateY(0);
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #message .char.space { width: 0.28em; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    #bottom-ui {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: calc(28px + var(--safe-bottom));
      pointer-events: none;
    }
    #signature {
      font-size: 0.92rem; font-weight: 400; letter-spacing: 0.04em; color: var(--text);
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      margin-bottom: 14px;
    }
    #signature.visible { opacity: 0.72; transform: translateY(0); }
    #replay {
      pointer-events: none; opacity: 0; transform: translateY(12px);
      min-height: 46px; min-width: 140px; padding: 12px 30px; border-radius: 999px;
      border: 1px solid rgba(225, 29, 72, 0.16);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: var(--accent); font-family: inherit; font-size: 0.95rem; font-weight: 500;
      letter-spacing: 0.02em; cursor: pointer;
      box-shadow: 0 4px 22px rgba(225, 29, 72, 0.08);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #replay.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #replay:hover { background: rgba(255, 255, 255, 0.95); box-shadow: 0 6px 28px rgba(225, 29, 72, 0.14); }
    #replay:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      .orb, .bg-glow { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>
    <div class="orb orb-4" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div id="message" aria-live="polite"></div>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="bottom-ui">
      <div id="signature">Andy</div>
      <button id="replay" type="button">Ver de nuevo</button>
    </div>
  </div>
  <script>
(function () {
  'use strict';
  const LINES = [
    { text: 'Hola Ma,', gapAfter: false },
    { text: 'espero que la pases muy lindo', gapAfter: false },
    { text: 'en este d\u00eda de la madre.', gapAfter: true },
    { text: 'En este d\u00eda de la madre 2026', gapAfter: false },
    { text: 'intent\u00e9 hacer algo distinto;', gapAfter: false },
    { text: 'espero que te guste', gapAfter: false },
    { text: 'y disfrutes tu d\u00eda.', gapAfter: false },
    { text: 'Andy', gapAfter: false, isSignature: true }
  ];
  const CHAR_MS = 38;
  const LINE_PAUSE_MS = 580;
  const HOLD_AFTER_TEXT_MS = 2200;
  const FORM_MS = 3000;
  const FILL_MS = 2400;
  const PARTICLES_PER_CHAR = 11;
  const AFTERGLOW_MS = 6500;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const messageEl = document.getElementById('message');
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: true });
  const replayBtn = document.getElementById('replay');
  const signatureEl = document.getElementById('signature');
  let width = 0, height = 0, dpr = 1;
  let particles = [];
  let outlinePts = [];
  let phase = 'idle';
  let rafId = 0;
  let timers = [];
  let charEls = [];
  let heartScale = 1, cx = 0, cy = 0;
  let residualParticles = [];
  function trackTimeout(fn, ms) {
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }
  function clearAllTimers() {
    timers.forEach(clearTimeout);
    timers = [];
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function heartPoint(t, scale, hx, hy) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return { x: hx + x * scale, y: hy + y * scale };
  }
  function generateHeartOutline(count, scale, hx, hy) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      pts.push(heartPoint((i / count) * Math.PI * 2, scale, hx, hy));
    }
    return pts;
  }
  function buildMessage() {
    messageEl.innerHTML = '';
    messageEl.style.opacity = '1';
    messageEl.style.transition = 'none';
    charEls = [];
    LINES.forEach((line) => {
      const lineEl = document.createElement('span');
      lineEl.className = 'line' + (line.gapAfter ? ' gap-after' : '') + (line.isSignature ? ' signature-line' : '');
      for (let i = 0; i < line.text.length; i++) {
        const ch = line.text[i];
        const span = document.createElement('span');
        span.className = 'char' + (ch === ' ' ? ' space' : '');
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        lineEl.appendChild(span);
        charEls.push(span);
      }
      messageEl.appendChild(lineEl);
    });
  }
  function runTypewriter(done) {
    phase = 'text';
    const lineEnds = [];
    let acc = 0;
    LINES.forEach((line) => { acc += line.text.length; lineEnds.push(acc - 1); });
    let i = 0;
    function next() {
      if (i >= charEls.length) { trackTimeout(done, HOLD_AFTER_TEXT_MS); return; }
      charEls[i].classList.add('on');
      const isLineEnd = lineEnds.indexOf(i) !== -1;
      i++;
      trackTimeout(next, isLineEnd ? LINE_PAUSE_MS : CHAR_MS);
    }
    trackTimeout(next, 450);
  }
  function startDisintegration() {
    phase = 'disintegrate';
    particles = [];
    residualParticles = [];
    heartScale = Math.min(width, height) * 0.0138;
    cx = width / 2;
    cy = height / 2 - height * 0.02;
    outlinePts = generateHeartOutline(320, heartScale, cx, cy);
    if (reducedMotion) {
      messageEl.style.transition = 'opacity 0.8s ease';
      messageEl.style.opacity = '0';
      trackTimeout(() => { drawSimpleHeart(1); phase = 'done'; showEndUI(); }, 900);
      return;
    }
    const origins = [];
    charEls.forEach((el) => {
      if (el.classList.contains('space') || !el.classList.contains('on')) return;
      const r = el.getBoundingClientRect();
      origins.push({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
      el.style.transition = 'opacity 0.4s ease, transform 0.45s ease';
      el.style.opacity = '0';
      el.style.transform = 'scale(0.4) translateY(4px)';
    });
    trackTimeout(() => { messageEl.style.transition = 'opacity 0.35s ease'; messageEl.style.opacity = '0'; }, 380);
    const total = Math.max(origins.length * PARTICLES_PER_CHAR, outlinePts.length);
    for (let i = 0; i < total; i++) {
      const origin = origins[i % origins.length] || { x: cx, y: cy };
      const target = outlinePts[Math.floor((i / total) * outlinePts.length) % outlinePts.length];
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.8 + Math.random() * 2.8;
      particles.push({
        x: origin.x + (Math.random() - 0.5) * 3, y: origin.y + (Math.random() - 0.5) * 3,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        tx: target.x + (Math.random() - 0.5) * 0.9, ty: target.y + (Math.random() - 0.5) * 0.9,
        size: 1.5 + Math.random() * 1.5, alpha: 0.88 + Math.random() * 0.12,
        color: Math.random() > 0.55 ? '#fb7185' : '#e11d48', delay: Math.random() * 0.15
      });
    }
    let start = null;
    function formFrame(ts) {
      if (!start) start = ts;
      const t = Math.min(1, (ts - start) / FORM_MS);
      ctx.clearRect(0, 0, width, height);
      let close = true;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const local = Math.max(0, Math.min(1, (t - p.delay) / (1 - p.delay * 0.4)));
        const e = easeOutCubic(local);
        if (local < 0.18) { p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93; }
        const pull = 0.04 + e * 0.13;
        p.x += (p.tx - p.x) * pull; p.y += (p.ty - p.y) * pull;
        if (Math.hypot(p.tx - p.x, p.ty - p.y) > 2.2) close = false;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.7 + e * 0.3), 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha * (0.5 + e * 0.5); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (t < 1 || !close) rafId = requestAnimationFrame(formFrame);
      else { particles.forEach((p) => { p.x = p.tx; p.y = p.ty; }); startFill(); }
    }
    rafId = requestAnimationFrame(formFrame);
  }
  function startFill() {
    phase = 'fill';
    const start = performance.now();
    let minY = Infinity, maxY = -Infinity;
    outlinePts.forEach((p) => { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; });
    const hH = maxY - minY;
    function fillFrame(now) {
      const t = Math.min(1, (now - start) / FILL_MS);
      const e = easeInOutCubic(t);
      ctx.clearRect(0, 0, width, height);
      const fillLevel = maxY - hH * e;
      const feather = 10 + (1 - e) * 8;
      ctx.save();
      ctx.beginPath();
      outlinePts.forEach((pt, i) => (i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)));
      ctx.closePath(); ctx.clip();
      const grad = ctx.createLinearGradient(cx, maxY, cx, minY);
      grad.addColorStop(0, '#9f1239'); grad.addColorStop(0.35, '#e11d48');
      grad.addColorStop(0.75, '#f43f5e'); grad.addColorStop(1, '#fb7185');
      ctx.fillStyle = grad; ctx.fillRect(cx - heartScale * 24, fillLevel, heartScale * 48, maxY - fillLevel + 16);
      if (e < 0.98) {
        const softGrad = ctx.createLinearGradient(cx, fillLevel - feather, cx, fillLevel + feather);
        softGrad.addColorStop(0, 'rgba(251, 113, 133, 0)');
        softGrad.addColorStop(0.5, 'rgba(225, 29, 72, 0.35)');
        softGrad.addColorStop(1, 'rgba(225, 29, 72, 0)');
        ctx.fillStyle = softGrad;
        ctx.fillRect(cx - heartScale * 24, fillLevel - feather, heartScale * 48, feather * 2);
      }
      ctx.restore();
      const pAlpha = 1 - e * 0.55;
      particles.forEach((p) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.9, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha * pAlpha; ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (e > 0.35) {
        ctx.save(); ctx.globalAlpha = (e - 0.35) * 0.18;
        ctx.shadowColor = '#e11d48'; ctx.shadowBlur = 22 + e * 12;
        ctx.beginPath();
        outlinePts.forEach((pt, i) => (i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)));
        ctx.closePath(); ctx.fillStyle = '#e11d48'; ctx.fill(); ctx.restore();
      }
      if (t < 1) rafId = requestAnimationFrame(fillFrame);
      else beginHeartbeat();
    }
    rafId = requestAnimationFrame(fillFrame);
  }
  function drawHeartPath(scaleMul) {
    const s = heartScale * scaleMul;
    ctx.beginPath();
    generateHeartOutline(120, s, cx, cy).forEach((pt, i) => (i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)));
    ctx.closePath();
  }
  function drawSimpleHeart(alpha) {
    ctx.clearRect(0, 0, width, height);
    ctx.save(); ctx.globalAlpha = alpha; drawHeartPath(1);
    const grad = ctx.createLinearGradient(cx, cy + heartScale * 14, cx, cy - heartScale * 14);
    grad.addColorStop(0, '#9f1239'); grad.addColorStop(0.45, '#e11d48'); grad.addColorStop(1, '#f43f5e');
    ctx.fillStyle = grad; ctx.fill();
    ctx.shadowColor = '#e11d48'; ctx.shadowBlur = 20; ctx.globalAlpha = alpha * 0.3; ctx.fill(); ctx.restore();
  }
  function drawMiniHeart(x, y, size, color, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.scale(size / 16, size / 16);
    ctx.beginPath();
    for (let i = 0; i <= 32; i++) {
      const t = (i / 32) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.fill(); ctx.restore();
  }
  function spawnRisingParticle() {
    const fromEdge = Math.random() > 0.35;
    let x, y;
    if (fromEdge && outlinePts.length) {
      const pt = outlinePts[Math.floor(Math.random() * outlinePts.length)];
      x = pt.x + (Math.random() - 0.5) * 18; y = pt.y + (Math.random() - 0.5) * 10;
    } else {
      x = cx + (Math.random() - 0.5) * heartScale * 28;
      y = cy + heartScale * 8 + Math.random() * 30;
    }
    residualParticles.push({
      x: x, y: y, vx: (Math.random() - 0.5) * 0.35, vy: -0.35 - Math.random() * 0.55,
      size: 3.5 + Math.random() * 5.5, life: 1, decay: 0.0025 + Math.random() * 0.0035,
      color: Math.random() > 0.45 ? '#fb7185' : (Math.random() > 0.5 ? '#fda4af' : '#f43f5e'),
      isHeart: Math.random() > 0.4, wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.02 + Math.random() * 0.03
    });
  }
  function beginHeartbeat() {
    phase = 'heartbeat';
    residualParticles = [];
    for (let i = 0; i < 18; i++) spawnRisingParticle();
    const start = performance.now();
    const beatDuration = 2200;
    function beatFrame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / beatDuration);
      let pulse = 1;
      if (t < 0.28) pulse = 1 + 0.04 * Math.sin((t / 0.28) * Math.PI);
      else if (t > 0.32 && t < 0.55) pulse = 1 + 0.028 * Math.sin(((t - 0.32) / 0.23) * Math.PI);
      else if (t > 0.62 && t < 0.88) pulse = 1 + 0.018 * Math.sin(((t - 0.62) / 0.26) * Math.PI);
      ctx.clearRect(0, 0, width, height);
      drawPulsingHeart(pulse);
      updateAndDrawResiduals();
      if (t < 1) rafId = requestAnimationFrame(beatFrame);
      else startAfterglow();
    }
    rafId = requestAnimationFrame(beatFrame);
  }
  function drawPulsingHeart(pulse) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(pulse, pulse); ctx.translate(-cx, -cy);
    drawHeartPath(1);
    const grad = ctx.createLinearGradient(cx, cy + heartScale * 14, cx, cy - heartScale * 14);
    grad.addColorStop(0, '#9f1239'); grad.addColorStop(0.45, '#e11d48'); grad.addColorStop(1, '#f43f5e');
    ctx.fillStyle = grad; ctx.fill();
    ctx.globalAlpha = 0.2 + (pulse - 1) * 5;
    ctx.shadowColor = '#e11d48'; ctx.shadowBlur = 24 + (pulse - 1) * 90; ctx.fill(); ctx.restore();
  }
  function updateAndDrawResiduals() {
    if (Math.random() < 0.12 && residualParticles.length < 55) spawnRisingParticle();
    for (let i = residualParticles.length - 1; i >= 0; i--) {
      const rp = residualParticles[i];
      rp.wobble += rp.wobbleSpeed;
      rp.x += rp.vx + Math.sin(rp.wobble) * 0.15;
      rp.y += rp.vy; rp.life -= rp.decay;
      if (rp.life <= 0 || rp.y < -20) { residualParticles.splice(i, 1); continue; }
      if (rp.isHeart) drawMiniHeart(rp.x, rp.y, rp.size * rp.life, rp.color, rp.life * 0.7);
      else {
        ctx.beginPath(); ctx.arc(rp.x, rp.y, (rp.size * 0.35) * rp.life, 0, Math.PI * 2);
        ctx.fillStyle = rp.color; ctx.globalAlpha = rp.life * 0.6; ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function startAfterglow() {
    phase = 'afterglow';
    const start = performance.now();
    let signatureShown = false, buttonShown = false;
    function afterglowFrame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / AFTERGLOW_MS);
      const breath = 1 + 0.012 * Math.sin(elapsed / 900 * Math.PI * 2);
      ctx.clearRect(0, 0, width, height);
      drawPulsingHeart(breath);
      updateAndDrawResiduals();
      if (!signatureShown && elapsed > 1200) { signatureShown = true; signatureEl.classList.add('visible'); }
      if (!buttonShown && elapsed > AFTERGLOW_MS - 1800) { buttonShown = true; replayBtn.classList.add('visible'); }
      if (t < 1) rafId = requestAnimationFrame(afterglowFrame);
      else { phase = 'done'; holdAmbient(); }
    }
    rafId = requestAnimationFrame(afterglowFrame);
  }
  function holdAmbient() {
    function ambientFrame(now) {
      if (phase !== 'done') return;
      const breath = 1 + 0.01 * Math.sin(now / 1000 * Math.PI * 2);
      ctx.clearRect(0, 0, width, height);
      drawPulsingHeart(breath);
      updateAndDrawResiduals();
      rafId = requestAnimationFrame(ambientFrame);
    }
    rafId = requestAnimationFrame(ambientFrame);
  }
  function showEndUI() {
    signatureEl.classList.add('visible');
    trackTimeout(() => { replayBtn.classList.add('visible'); }, 600);
  }
  function resetAll() {
    clearAllTimers();
    particles = []; residualParticles = []; outlinePts = [];
    phase = 'idle';
    ctx.clearRect(0, 0, width, height);
    signatureEl.classList.remove('visible');
    replayBtn.classList.remove('visible');
    messageEl.style.opacity = ''; messageEl.style.transition = '';
    buildMessage();
    runTypewriter(startDisintegration);
  }
  function start() {
    clearAllTimers(); resize(); buildMessage(); runTypewriter(startDisintegration);
  }
  window.addEventListener('resize', () => {
    resize();
    if (phase === 'done') {
      heartScale = Math.min(width, height) * 0.0138;
      cx = width / 2; cy = height / 2 - height * 0.02;
      outlinePts = generateHeartOutline(120, heartScale, cx, cy);
      drawSimpleHeart(1);
    }
  });
  replayBtn.addEventListener('click', resetAll);
  start();
})();
  </script>
