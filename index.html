<script>
(function(){
'use strict';
const LINES=[
{text:'Hola Ma,',gapAfter:false,pause:'short'},
{text:'espero que la pases muy lindo',gapAfter:false,pause:'short'},
{text:'en este d\u00eda de la madre.',gapAfter:true,pause:'long'},
{text:'En este d\u00eda de la madre 2026',gapAfter:false,pause:'short'},
{text:'intent\u00e9 hacer algo distinto,',gapAfter:false,pause:'short'},
{text:'espero que te guste',gapAfter:false,pause:'short'},
{text:'y disfrutes tu d\u00eda.',gapAfter:false,pause:'medium'},
{text:'Andy',gapAfter:false,isSignature:true,pause:'medium'}
];
const CHAR_MS=36,PAUSE={short:160,medium:360,long:600},HOLD_AFTER_TEXT_MS=2000,FORM_MS=3200,FILL_MS=2400,PARTICLES_PER_CHAR=10,AFTERGLOW_MS=6500;
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const messageEl=document.getElementById('message');
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:true});
const replayBtn=document.getElementById('replay');
const signatureEl=document.getElementById('signature');
let width=0,height=0,dpr=1,particles=[],outlinePts=[],phase='idle',rafId=0,timers=[],charEls=[],heartScale=1,cx=0,cy=0,residualParticles=[];
function trackTimeout(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id}
function clearAllTimers(){timers.forEach(clearTimeout);timers=[];if(rafId){cancelAnimationFrame(rafId);rafId=0}}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function heartPoint(t,scale,hx,hy){const x=16*Math.pow(Math.sin(t),3);const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));return{x:hx+x*scale,y:hy+y*scale}}
function generateHeartOutline(count,scale,hx,hy){
  const dense=512,densePts=[];
  for(let i=0;i<dense;i++)densePts.push(heartPoint((i/dense)*Math.PI*2,scale,hx,hy));
  const cum=[0];let total=0;
  for(let i=1;i<=dense;i++){const a=densePts[i%dense],b=densePts[(i-1)%dense];const d=Math.hypot(a.x-b.x,a.y-b.y);total+=d;cum.push(total)}
  const pts=[],step=total/count;let idx=1;
  for(let k=0;k<count;k++){const target=k*step;while(idx<cum.length-1&&cum[idx]<target)idx++;const t0=cum[idx-1],t1=cum[idx];const f=t1>t0?(target-t0)/(t1-t0):0;const p0=densePts[(idx-1)%dense],p1=densePts[idx%dense];pts.push({x:p0.x+(p1.x-p0.x)*f,y:p0.y+(p1.y-p0.y)*f})}
  return pts;
}
function buildMessage(){messageEl.innerHTML='';messageEl.style.opacity='1';messageEl.style.transition='none';charEls=[];LINES.forEach(line=>{const lineEl=document.createElement('span');lineEl.className='line'+(line.gapAfter?' gap-after':'')+(line.isSignature?' signature-line':'');for(let i=0;i<line.text.length;i++){const ch=line.text[i];const span=document.createElement('span');span.className='char'+(ch===' '?' space':'');span.textContent=ch===' '?'\u00A0':ch;lineEl.appendChild(span);charEls.push(span)}messageEl.appendChild(lineEl)})}
function runTypewriter(done){phase='text';const lineEndPause={};let acc=0;LINES.forEach(line=>{acc+=line.text.length;lineEndPause[acc-1]=PAUSE[line.pause||'medium']||PAUSE.medium});let i=0;function next(){if(i>=charEls.length){trackTimeout(done,HOLD_AFTER_TEXT_MS);return}requestAnimationFrame(()=>{charEls[i].classList.add('on')});const delay=(i in lineEndPause)?lineEndPause[i]:CHAR_MS;i++;trackTimeout(next,delay)}trackTimeout(next,400)}
function sampleCharOrigins(el,samples){
  const r=el.getBoundingClientRect();if(r.width<1||r.height<1)return[];
  const pts=[],cols=Math.max(2,Math.min(4,Math.ceil(r.width/4))),rows=Math.max(2,Math.min(3,Math.ceil(r.height/5)));
  for(let row=0;row<rows;row++){for(let col=0;col<cols;col++){const u=(col+.35+Math.random()*.3)/cols,v=(row+.35+Math.random()*.3)/rows;pts.push({x:r.left+u*r.width,y:r.top+v*r.height});if(pts.length>=samples)return pts}}
  return pts;
}
function startDisintegration(){
  phase='disintegrate';particles=[];residualParticles=[];
  heartScale=Math.min(width,height)*0.0138;cx=width/2;cy=height/2-height*0.02;
  outlinePts=generateHeartOutline(320,heartScale,cx,cy);
  if(reducedMotion){messageEl.style.transition='opacity .8s ease';messageEl.style.opacity='0';trackTimeout(()=>{drawSimpleHeart(1);phase='done';showEndUI()},900);return}
  messageEl.style.opacity='1';messageEl.style.transition='none';
  const activeChars=charEls.filter(el=>!el.classList.contains('space')&&el.classList.contains('on'));
  const perChar=Math.max(6,Math.min(12,PARTICLES_PER_CHAR));
  let particleCount=0;
  activeChars.forEach((el,i)=>{
    const baseDelay=90+i*42;
    trackTimeout(()=>{
      const samples=sampleCharOrigins(el,perChar);
      const r=el.getBoundingClientRect();const cx0=r.left+r.width/2,cy0=r.top+r.height/2;
      samples.forEach((pt,si)=>{
        const target=outlinePts[(particleCount+si)%outlinePts.length];
        const ang=Math.atan2(pt.y-cy0,pt.x-cx0)+(Math.random()-.5)*.8;
        const burst=.55+Math.random()*1.35;
        particles.push({x:pt.x,y:pt.y,vx:Math.cos(ang)*burst,vy:Math.sin(ang)*burst-.2,tx:target.x+(Math.random()-.5)*.8,ty:target.y+(Math.random()-.5)*.8,size:1.6+Math.random()*1.8,alpha:.95,color:Math.random()>.45?'#fb7185':'#e11d48',born:performance.now(),freeMs:280+Math.random()*220});
      });
      particleCount+=samples.length;
      el.style.transition='opacity .28s ease,filter .28s ease,transform .35s ease';
      el.style.opacity='0';el.style.filter='blur(1.2px)';el.style.transform='scale(.92)';
    },baseDelay);
  });
  trackTimeout(()=>{
    let start=null,lastTs=null;
    function formFrame(ts){
      if(!start)start=ts;if(!lastTs)lastTs=ts;
      const dt=Math.min(32,ts-lastTs)/16.67;lastTs=ts;const elapsed=ts-start;
      const formProgress=Math.min(1,Math.max(0,(elapsed-200)/FORM_MS));
      ctx.clearRect(0,0,width,height);let close=true;ctx.save();
      for(let i=0;i<particles.length;i++){
        const p=particles[i];const age=ts-p.born;const free=age<p.freeMs;
        if(free){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.97;p.vy*=0.97;close=false}
        else{const pull=0.035+0.04*formProgress;p.x+=(p.tx-p.x)*pull*dt;p.y+=(p.ty-p.y)*pull*dt;p.vx*=0.9;p.vy*=0.9;p.x+=p.vx*dt;p.y+=p.vy*dt;if(Math.hypot(p.tx-p.x,p.ty-p.y)>1.4)close=false}
        const fadeIn=Math.min(1,age/80);
        ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.8,0,Math.PI*2);ctx.globalAlpha=p.alpha*fadeIn*.22;ctx.fill();
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*(free?1.15:1),0,Math.PI*2);ctx.globalAlpha=p.alpha*fadeIn;ctx.fill();
      }
      ctx.restore();
      if(!(formProgress>=1&&close&&elapsed>FORM_MS*.55)&&elapsed<FORM_MS+1800)rafId=requestAnimationFrame(formFrame);
      else{phase='outline';messageEl.style.transition='opacity .3s ease';messageEl.style.opacity='0';trackTimeout(startFill,260)}
    }
    rafId=requestAnimationFrame(formFrame);
  },120);
}
function startFill(){phase='fill';const start=performance.now();
function fillFrame(now){const t=Math.min(1,(now-start)/FILL_MS);const e=easeOutCubic(t);ctx.clearRect(0,0,width,height);drawHeartFill(e);if(t<1)rafId=requestAnimationFrame(fillFrame);else{spawnResiduals();startAfterglow()}}rafId=requestAnimationFrame(fillFrame)}
function drawHeartFill(progress){const s=heartScale;const pts=generateHeartOutline(160,s,cx,cy);ctx.save();ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.clip();const maxR=Math.hypot(s*16,s*16)*1.15;const r=maxR*progress;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'#e11d48');g.addColorStop(.45,'#fb7185');g.addColorStop(1,'rgba(251,113,133,0)');ctx.fillStyle=g;ctx.globalAlpha=.92;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.strokeStyle='#e11d48';ctx.lineWidth=1.6;ctx.globalAlpha=.7+progress*.3;ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.stroke();ctx.restore()}
function spawnResiduals(){for(let i=0;i<28;i++){const ang=Math.random()*Math.PI*2;const sp=.15+Math.random()*.45;residualParticles.push({x:cx+(Math.random()-.5)*heartScale*8,y:cy+(Math.random()-.5)*heartScale*8,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-.25,size:.8+Math.random()*1.6,color:Math.random()>.5?'#fb7185':'#fda4af',life:1,decay:.003+Math.random()*.004,wobble:Math.random()*10,wobbleSpeed:.02+Math.random()*.03,isHeart:Math.random()>.65,rot:Math.random()*Math.PI,rotSpeed:(Math.random()-.5)*.04})}}
function drawPulsingHeart(scaleMult){const s=heartScale*scaleMult;const pts=generateHeartOutline(180,s,cx,cy);ctx.save();ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();const g=ctx.createRadialGradient(cx,cy-s*2,0,cx,cy,s*18);g.addColorStop(0,'#e11d48');g.addColorStop(.6,'#fb7185');g.addColorStop(1,'#fda4af');ctx.fillStyle=g;ctx.globalAlpha=.88;ctx.fill();ctx.strokeStyle='rgba(225,29,72,.4)';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function drawSimpleHeart(alpha){drawPulsingHeart(1);ctx.globalAlpha=alpha}
function drawMiniHeart(x,y,sz,color,alpha,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sz,sz);ctx.beginPath();ctx.moveTo(0,-4);ctx.bezierCurveTo(4,-8,8,-4,0,6);ctx.bezierCurveTo(-8,-4,-4,-8,0,-4);ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.fill();ctx.restore()}
function updateAndDrawResiduals(){for(let i=residualParticles.length-1;i>=0;i--){const rp=residualParticles[i];rp.wobble+=rp.wobbleSpeed;rp.rot=(rp.rot||0)+(rp.rotSpeed||0);rp.x+=rp.vx+Math.sin(rp.wobble)*.22;rp.y+=rp.vy;rp.vy*=.998;rp.life-=rp.decay;if(rp.life<=0||rp.y<-24){residualParticles.splice(i,1);continue}const lifeEase=rp.life<.2?rp.life/.2:(rp.life>.75?(1-rp.life)/.25:1);const a=Math.max(0,Math.min(1,lifeEase))*.75;if(rp.isHeart)drawMiniHeart(rp.x,rp.y,rp.size*(.55+rp.life*.45),rp.color,a,rp.rot*.3);else{const r=(rp.size*.32)*(.5+rp.life*.5);ctx.beginPath();ctx.arc(rp.x,rp.y,r*2.4,0,Math.PI*2);ctx.fillStyle=rp.color;ctx.globalAlpha=a*.2;ctx.fill();ctx.beginPath();ctx.arc(rp.x,rp.y,r,0,Math.PI*2);ctx.globalAlpha=a;ctx.fill()}}ctx.globalAlpha=1}
function startAfterglow(){phase='afterglow';const start=performance.now();let signatureShown=false,buttonShown=false;
function afterglowFrame(now){const elapsed=now-start;const breath=1+.012*Math.sin(elapsed/900*Math.PI*2);ctx.clearRect(0,0,width,height);drawPulsingHeart(breath);updateAndDrawResiduals();if(!signatureShown&&elapsed>1200){signatureShown=true;signatureEl.classList.add('visible')}if(!buttonShown&&elapsed>AFTERGLOW_MS-1800){buttonShown=true;replayBtn.classList.add('visible')}if(elapsed<AFTERGLOW_MS)rafId=requestAnimationFrame(afterglowFrame);else{phase='done';holdAmbient()}}rafId=requestAnimationFrame(afterglowFrame)}
function holdAmbient(){function ambientFrame(now){if(phase!=='done')return;const breath=1+.01*Math.sin(now/1000*Math.PI*2);ctx.clearRect(0,0,width,height);drawPulsingHeart(breath);updateAndDrawResiduals();rafId=requestAnimationFrame(ambientFrame)}rafId=requestAnimationFrame(ambientFrame)}
function showEndUI(){signatureEl.classList.add('visible');trackTimeout(()=>{replayBtn.classList.add('visible')},600)}
function resetAll(){clearAllTimers();particles=[];residualParticles=[];outlinePts=[];phase='idle';ctx.clearRect(0,0,width,height);signatureEl.classList.remove('visible');replayBtn.classList.remove('visible');messageEl.style.opacity='';messageEl.style.transition='';buildMessage();runTypewriter(startDisintegration)}
function start(){clearAllTimers();resize();buildMessage();runTypewriter(startDisintegration)}
window.addEventListener('resize',()=>{resize();if(phase==='done'){heartScale=Math.min(width,height)*0.0138;cx=width/2;cy=height/2-height*0.02;outlinePts=generateHeartOutline(120,heartScale,cx,cy);drawSimpleHeart(1)}});
replayBtn.addEventListener('click',resetAll);
start();
})();
</script>
